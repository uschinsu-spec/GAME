name: Clean Game Build

on:
  push:
    paths:
      - 'scripts/clean-game.mjs'
      - 'src/**'
      - '*.js'
      - '*.html'
      - '*.css'
      - 'maps/**'
      - '.github/workflows/clean-game.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit architecture and data
        run: node scripts/clean-game.mjs

      - name: Syntax audit
        run: |
          node tests/architecture.test.mjs
          node --check game.js
          node --check skill-master-data.js
          node --check systems-progression.js
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          git diff --check
