<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Tu Tiên Chi Lộ · Map Editor</title>
<style>
:root{color-scheme:dark;--bg:#0b1117;--panel:#111c25;--panel2:#172633;--line:#29404e;--gold:#e7c66b;--text:#eef6f4;--muted:#8ea7ad;--danger:#ff6b72;--ok:#6de0a0;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{border:1px solid var(--line);background:#1b2d39;color:var(--text);border-radius:9px;min-height:38px;padding:7px 11px;cursor:pointer}button:hover{border-color:#527080}button:active{transform:translateY(1px)}button.primary{background:#6d5420;border-color:#c49a37;color:#fff6cf}button.danger{color:#ffc4c6;border-color:#81434b}button.active{background:#274b56;border-color:#6fc3cf}.iconBtn{width:40px;padding:0;font-size:18px}.app{display:grid;grid-template-rows:auto 1fr auto;height:100dvh;padding-top:var(--safe-top)}
.topbar{display:flex;align-items:center;gap:7px;padding:7px 10px;border-bottom:1px solid var(--line);background:rgba(12,23,30,.98);z-index:30;min-width:0}.brand{display:flex;align-items:center;gap:9px;margin-right:4px;white-space:nowrap}.brandMark{display:grid;place-items:center;width:34px;height:34px;border:1px solid #c6a655;border-radius:10px;color:var(--gold);font-size:20px;background:#2b2515}.brand b{font-size:14px}.brand small{display:block;color:var(--muted);font-size:10px}.toolbar{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}.toolbar::-webkit-scrollbar{display:none}.toolbar button{white-space:nowrap}.main{display:grid;grid-template-columns:270px minmax(300px,1fr) 290px;min-height:0}.side{background:var(--panel);min-height:0;display:flex;flex-direction:column}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.sideHead{padding:10px;border-bottom:1px solid var(--line);display:grid;gap:8px}.sideHead h2,.inspector h2{font-size:13px;margin:0;color:var(--gold);text-transform:uppercase;letter-spacing:.08em}.search{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;background:#0b151c;color:#fff;padding:0 11px;outline:none}.search:focus{border-color:#6a96a6}.categoryTabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}.categoryTabs button{min-height:32px;padding:5px 8px;font-size:12px;white-space:nowrap}.assetGrid{padding:8px;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;align-content:start}.assetCard{min-width:0;padding:6px;height:116px;display:flex;flex-direction:column;gap:4px;align-items:center;background:#0d1820}.assetCard img{width:78px;height:78px;object-fit:contain;pointer-events:none}.assetCard span{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;color:#b8c9cd}.workspace{position:relative;overflow:hidden;background:#071015;touch-action:none}.stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:default}.world{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;background-color:#78937c;background-image:url('assets/maps/common/grounds/ground_village_01.png');background-repeat:repeat;background-size:280px 280px}.world:before{content:"";position:absolute;inset:-3000px;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:var(--grid-size,35px) var(--grid-y,27px);background-position:var(--grid-x,0) var(--grid-pos-y,0);pointer-events:none}.axisX,.axisZ{position:absolute;pointer-events:none;opacity:.7}.axisX{height:1px;background:#e9c65c;left:-5000px;width:10000px}.axisZ{width:1px;background:#6fc9dd;top:-5000px;height:10000px}.mapObj{position:absolute;transform:translate(-50%,-100%);transform-origin:50% 100%;user-select:none;-webkit-user-drag:none;touch-action:none;filter:drop-shadow(0 4px 3px rgba(0,0,0,.26))}.mapObj.selected{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 7px #ffd55d)}.mapObj.locked{opacity:.72}.selectionBox{position:absolute;border:1px dashed #ffe17f;background:rgba(255,222,99,.08);pointer-events:none}.emptyHint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;border:1px dashed #55717b;border-radius:12px;background:rgba(7,16,21,.75);color:#adc0c5;text-align:center;pointer-events:none}.viewTools{position:absolute;left:10px;top:10px;display:flex;gap:6px;z-index:12}.zoomBox{position:absolute;right:10px;top:10px;display:flex;gap:5px;z-index:12}.zoomBox button,.viewTools button{background:rgba(13,26,34,.94)}.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#10232b;border:1px solid #477080;border-radius:10px;padding:9px 14px;z-index:50;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.inspector{padding:11px;overflow:auto}.inspector h2{margin-bottom:10px}.emptyInspector{color:var(--muted);padding:20px 5px;text-align:center}.fieldGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:4px;margin-bottom:8px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.field input,.field select{height:36px;width:100%;border:1px solid var(--line);border-radius:8px;background:#0b151c;color:#fff;padding:0 9px;outline:none}.field input:focus,.field select:focus{border-color:#6a96a6}.preview{height:128px;border:1px solid var(--line);border-radius:10px;background:repeating-conic-gradient(#27343a 0 25%,#34454b 0 50%) 50%/24px 24px;display:grid;place-items:center;margin-bottom:10px;overflow:hidden}.preview img{max-width:92%;max-height:92%;object-fit:contain}.row{display:flex;gap:7px}.row>*{flex:1}.check{display:flex;align-items:center;gap:7px;margin:8px 0;color:#c3d0d3}.check input{width:18px;height:18px}.objectList{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}.objectList h3{font-size:11px;color:var(--muted);margin:0 0 7px;text-transform:uppercase}.objRows{display:grid;gap:4px;max-height:180px;overflow:auto}.objRow{display:flex;align-items:center;gap:6px;text-align:left;min-height:34px;padding:5px 7px;background:#0d1820}.objRow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.objRow em{margin-left:auto;color:var(--muted);font-style:normal;font-size:10px}.statusbar{height:28px;border-top:1px solid var(--line);background:#0b151c;color:var(--muted);display:flex;align-items:center;gap:14px;padding:0 10px calc(var(--safe-bottom)*.15);font-size:11px;white-space:nowrap;overflow:hidden}.statusbar .ok{color:var(--ok)}.mobileToggle{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:grid;place-items:center;padding:16px}.modal[hidden]{display:none}.modalBox{width:min(560px,100%);max-height:88dvh;overflow:auto;background:var(--panel);border:1px solid #47606c;border-radius:14px;padding:14px}.modalBox h2{margin:0 0 12px;color:var(--gold);font-size:17px}.modalBox textarea{width:100%;height:260px;background:#071015;color:#d9f0e9;border:1px solid var(--line);border-radius:9px;padding:10px;font:12px/1.45 ui-monospace,monospace;resize:vertical}.modalActions{display:flex;justify-content:flex-end;gap:7px;margin-top:10px}
.world.noGrid:before{display:none}
@media(max-width:900px){.main{grid-template-columns:1fr}.side{position:fixed;top:calc(50px + var(--safe-top));bottom:28px;width:min(88vw,330px);z-index:40;box-shadow:0 12px 30px #000;transition:transform .22s}.left{left:0;transform:translateX(-105%)}.right{right:0;transform:translateX(105%)}.side.open{transform:translateX(0)}.mobileToggle{display:inline-grid;place-items:center}.brand small{display:none}.brand b{font-size:12px}.brandMark{width:30px;height:30px}.topbar{height:50px;padding:5px 7px}.toolbar button:not(.keepMobile){display:none}.workspace{grid-column:1}.assetGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.assetCard{height:104px}.assetCard img{width:66px;height:66px}.statusbar{gap:8px}.statusbar span:nth-child(n+4){display:none}}
@media(max-width:430px){.assetGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{gap:4px}.toolbar{gap:4px}.iconBtn{width:37px}.brand{margin-right:0}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button id="assetsToggle" class="iconBtn mobileToggle" title="Kho asset">☰</button>
    <div class="brand"><span class="brandMark">◇</span><span><b>MAP EDITOR</b><small>Tu Tiên Chi Lộ</small></span></div>
    <nav class="toolbar">
      <button id="loadGameBtn" class="keepMobile">Nạp map GAME</button>
      <button id="newBtn">Map mới</button>
      <button id="undoBtn" class="iconBtn keepMobile" title="Hoàn tác">↶</button>
      <button id="redoBtn" class="iconBtn keepMobile" title="Làm lại">↷</button>
      <button id="saveBtn">Lưu máy</button>
      <button id="exportBtn" class="primary keepMobile">Xuất JSON</button>
      <button id="importBtn">Nhập JSON</button>
      <button id="copyBtn">Sao chép mã GAME</button>
    </nav>
    <button id="inspectorToggle" class="iconBtn mobileToggle" title="Thuộc tính">⚙</button>
    <input id="fileInput" type="file" accept="application/json,.json" hidden>
  </header>

  <main class="main">
    <aside id="assetPanel" class="side left">
      <div class="sideHead">
        <h2>Kho asset map</h2>
        <input id="assetSearch" class="search" placeholder="Tìm cây, nhà, đá, cổng…">
        <div id="categoryTabs" class="categoryTabs"></div>
      </div>
      <div id="assetGrid" class="assetGrid"></div>
    </aside>

    <section class="workspace">
      <div id="stage" class="stage">
        <div id="world" class="world">
          <div id="axisX" class="axisX"></div><div id="axisZ" class="axisZ"></div>
          <div id="objectsLayer"></div>
        </div>
        <div id="emptyHint" class="emptyHint">Chọn một asset ở bên trái để thêm vào map<br><small>Kéo asset để di chuyển · chạm để chọn</small></div>
        <div class="viewTools">
          <button id="selectMode" class="active">Chọn</button>
          <button id="panMode">Di chuyển màn hình</button>
          <button id="gridBtn" class="active">Lưới</button>
          <button id="wallBtn">+ Vòng tường 9 góc</button>
        </div>
        <div class="zoomBox"><button id="zoomOut">−</button><button id="resetView">100%</button><button id="zoomIn">+</button></div>
        <div id="toast" class="toast"></div>
      </div>
    </section>

    <aside id="inspectorPanel" class="side right">
      <div id="inspector" class="inspector"></div>
    </aside>
  </main>

  <footer class="statusbar">
    <span id="saveStatus" class="ok">Đã lưu</span><span id="objectCount">0 asset</span><span id="cursorPos">X 0 · Z 0</span><span id="zoomStatus">Zoom 100%</span><span>Phím: Delete · Ctrl+Z/Y · Ctrl+D · ←↑↓→</span>
  </footer>
</div>

<div id="jsonModal" class="modal" hidden>
  <div class="modalBox">
    <h2 id="modalTitle">Dữ liệu map</h2>
    <textarea id="jsonText" spellcheck="false"></textarea>
    <div class="modalActions"><button id="modalClose">Đóng</button><button id="modalCopy" class="primary">Sao chép</button></div>
  </div>
</div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const STORAGE='tutien_map_editor_v1', PROJ=Math.sin(50*Math.PI/180);
const CATEGORY_LABELS={all:'Tất cả',buildings:'Nhà',trees:'Cây',rocks:'Đá',plants:'Cỏ hoa',props:'Đạo cụ',fences_gates:'Tường/Cổng',lanterns:'Đèn',bridges_water:'Cầu/Nước',signs:'Biển',magical:'Pháp thuật'};
const FILES={
  buildings:['house_herbal_01.png','house_sakura_01.png','house_thatch_01.png','house_tile_01.png','pavilion_shrine_01.png','pavilion_water_01.png','shop_house_01.png','shrine_buddha_01.png','shrine_small_01.png','smithy_01.png','warehouse_thatch_01.png'],
  trees:['tree_01.png','tree_02.png','tree_03.png','tree_ancient_green_01.png','tree_autumn_01.png','tree_lantern_01.png','tree_magic_wisp_01.png','tree_pine_01.png','tree_pink_blossom_02.png','tree_sakura_01.png','tree_white_blossom_01.png','tree_willow_01.png'],
  rocks:['rock_01.png','rock_02.png','rock_03.png','rock_04.png','rock_05.png','rock_cliff_cluster_01.png','rock_cluster_flower_01.png','rock_flat_steps_01.png','rock_flower_mound_01.png','rock_flower_patch_01.png','rock_lantern_cluster_01.png','rock_large_vine_01.png','rock_tall_vine_01.png','rock_tall_vine_02.png','rock_waterfall_01.png'],
  plants:['bush_berry_01.png','bush_green_01.png','bush_ivy_01.png','bush_mixed_flower_01.png','bush_pink_01.png','bush_purple_01.png','bush_rose_01.png','bush_white_01.png','flower_pink_01.png','flower_purple_01.png','grass_flower_01.png','grass_mixed_01.png','grass_pampas_01.png','grass_tall_01.png'],
  props:['barrel_stack_01.png','campfire_01.png','cart_wood_01.png','crate_stack_01.png','jar_stack_01.png','sack_stack_01.png','stall_cloth_01.png','stall_fruit_01.png','weapon_rack_01.png','well_01.png'],
  fences_gates:['bell_gate_01.png','fence_bamboo_01.png','fence_broken_01.png','fence_corner_01.png','fence_flower_01.png','fence_lantern_01.png','fence_ornate_01.png','fence_stone_01.png','fence_stone_wood_01.png','fence_wood_long_01.png','fence_wood_vine_01.png','gate_ornate_01.png','gate_shrine_01.png','gate_wood_01.png','stone_wall_50deg_00.png','stone_wall_50deg_01.png','stone_wall_50deg_02.png','stone_wall_50deg_03.png','stone_wall_50deg_04.png','stone_wall_50deg_05.png','stone_wall_50deg_06.png','stone_wall_50deg_07.png','stone_wall_50deg_08.png'],
  lanterns:['lantern_bridge_post_01.png','lantern_double_hanging_01.png','lantern_moss_01.png','lantern_post_01.png','lantern_post_village_01.png','lantern_sakura_hanging_01.png','lantern_shrine_01.png','lantern_stone_01.png','lantern_stone_round_01.png','lantern_tall_wood_01.png','lantern_wood_hanging_01.png'],
  bridges_water:['bridge_arch_wood_01.png','bridge_flat_wood_01.png','bridge_lantern_01.png','bridge_sakura_01.png','bridge_stone_01.png','dock_wood_01.png','fountain_stone_01.png','pond_lotus_01.png','stream_01.png','waterfall_01.png'],
  signs:['notice_board_01.png','sign_banner_01.png','sign_direction_01.png','sign_magic_stone_01.png','sign_stone_lantern_01.png','sign_stone_sakura_01.png','sign_stone_yinyang_01.png'],
  magical:['crystal_blue_01.png','loot_beam_gold_01.png']
};
const ASSETS=Object.entries(FILES).flatMap(([category,files])=>files.map(file=>({category,file,path:`assets/maps/common/${category}/${file}`})));
const DEFAULT_SIZE={buildings:[5.4,5.2],trees:[4.4,5.7],rocks:[3.1,3.2],plants:[1.9,1.9],props:[2.5,2.3],fences_gates:[3.3,3.3],lanterns:[2.1,3.3],bridges_water:[5.5,3.8],signs:[2.4,3.2],magical:[2.4,3.2]};
let state={version:1,mapId:'thanh_van_thon',mapName:'Thanh Vân Thôn',ground:'assets/maps/common/grounds/ground_village_01.png',objects:[]};
let view={zoom:7,panX:0,panY:0,grid:true,mode:'select'}, selectedId=null, history=[],future=[],drag=null,category='all',dirty=false;
const uid=()=>`obj_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`;
const clone=v=>JSON.parse(JSON.stringify(v));
const num=(v,d=0)=>Number.isFinite(+v)?+v:d;
const niceName=p=>(p.split('/').pop()||p).replace(/\.png$/,'').replaceAll('_',' ');
function categoryOf(path){let m=path.match(/common\/([^/]+)\//);return m?m[1]:'props'}
function newObject(asset,x=0,z=0,overrides={}){let cat=categoryOf(asset.path),sz=DEFAULT_SIZE[cat]||[3,3];return {id:uid(),name:niceName(asset.path),file:asset.path,x:+x.toFixed(2),z:+z.toFixed(2),width:sz[0],height:sz[1],layer:0,opacity:1,flipX:false,locked:false,...overrides}}
function snapshot(){history.push(JSON.stringify(state));if(history.length>60)history.shift();future=[]}
function markDirty(){dirty=true;$('#saveStatus').textContent='Chưa lưu';$('#saveStatus').classList.remove('ok');scheduleSave();}
let saveTimer;function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveLocal,700)}
function saveLocal(){localStorage.setItem(STORAGE,JSON.stringify(state));dirty=false;$('#saveStatus').textContent='Đã tự lưu';$('#saveStatus').classList.add('ok')}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),1800)}
function stageCenterWorld(){let r=$('#stage').getBoundingClientRect();return screenToWorld(r.width/2,r.height/2)}
function worldToScreen(x,z){let r=$('#stage').getBoundingClientRect();return {x:r.width/2+view.panX+x*view.zoom,y:r.height/2+view.panY-z*view.zoom*PROJ}}
function screenToWorld(x,y){let r=$('#stage').getBoundingClientRect();return {x:(x-r.width/2-view.panX)/view.zoom,z:-(y-r.height/2-view.panY)/(view.zoom*PROJ)}}
function snap(v){let step=$('#snapSize')?num($('#snapSize').value,1):1;return step>0?Math.round(v/step)*step:v}
function renderAssets(){let q=$('#assetSearch').value.trim().toLowerCase();let list=ASSETS.filter(a=>(category==='all'||a.category===category)&&(!q||a.file.toLowerCase().includes(q)));$('#assetGrid').innerHTML=list.map(a=>`<button class="assetCard" data-path="${a.path}" title="Thêm ${niceName(a.path)}"><img loading="lazy" src="${a.path}"><span>${niceName(a.path)}</span></button>`).join('');$$('.assetCard').forEach(b=>b.onclick=()=>{let a=ASSETS.find(x=>x.path===b.dataset.path),p=stageCenterWorld();snapshot();let o=newObject(a,snap(p.x),snap(p.z));state.objects.push(o);selectedId=o.id;markDirty();render();closeMobilePanels();toast('Đã thêm '+o.name)})}
function renderCategories(){let cats=['all',...Object.keys(FILES)];$('#categoryTabs').innerHTML=cats.map(c=>`<button class="${c===category?'active':''}" data-cat="${c}">${CATEGORY_LABELS[c]}</button>`).join('');$$('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderCategories();renderAssets()})}
function renderWorld(){let layer=$('#objectsLayer'),origin=worldToScreen(0,0);$('#axisX').style.top=origin.y+'px';$('#axisZ').style.left=origin.x+'px';let gs=Math.max(7,view.zoom*5),gy=gs*PROJ,w=$('#world');w.style.setProperty('--grid-size',gs+'px');w.style.setProperty('--grid-y',gy+'px');w.style.setProperty('--grid-x',(origin.x%gs)+'px');w.style.setProperty('--grid-pos-y',(origin.y%gy)+'px');w.classList.toggle('noGrid',!view.grid);w.style.backgroundImage=`url('${state.ground}')`;layer.innerHTML=state.objects.map(o=>{let p=worldToScreen(o.x,o.z),sel=o.id===selectedId?' selected':'',lock=o.locked?' locked':'',zi=100000-Math.round(o.z*100)+num(o.layer);return `<img class="mapObj${sel}${lock}" data-id="${o.id}" src="${o.file}" draggable="false" style="left:${p.x}px;top:${p.y}px;width:${o.width*view.zoom}px;height:${o.height*view.zoom}px;opacity:${o.opacity};z-index:${zi};transform:translate(-50%,-100%) scaleX(${o.flipX?-1:1})">`}).join('');$$('.mapObj').forEach(el=>el.addEventListener('pointerdown',objectPointerDown));$('#emptyHint').hidden=state.objects.length>0;$('#objectCount').textContent=`${state.objects.length} asset`;$('#zoomStatus').textContent=`Zoom ${Math.round(view.zoom/7*100)}%`;$('#resetView').textContent=Math.round(view.zoom/7*100)+'%'}
function renderInspector(){let box=$('#inspector'),o=state.objects.find(x=>x.id===selectedId);if(!o){box.innerHTML='<h2>Thuộc tính asset</h2><div class="emptyInspector">Chạm một asset trên map để chỉnh vị trí và kích thước.</div>';return}box.innerHTML=`<h2>Thuộc tính asset</h2><div class="preview"><img src="${o.file}"></div><div class="field full"><label>Tên</label><input data-prop="name" value="${escapeHtml(o.name)}"></div><div class="fieldGrid"><div class="field"><label>X</label><input data-prop="x" type="number" step="0.25" value="${o.x}"></div><div class="field"><label>Z</label><input data-prop="z" type="number" step="0.25" value="${o.z}"></div><div class="field"><label>Rộng</label><input data-prop="width" type="number" min="0.1" step="0.1" value="${o.width}"></div><div class="field"><label>Cao</label><input data-prop="height" type="number" min="0.1" step="0.1" value="${o.height}"></div><div class="field"><label>Lớp</label><input data-prop="layer" type="number" step="1" value="${o.layer}"></div><div class="field"><label>Độ mờ</label><input data-prop="opacity" type="number" min="0" max="1" step="0.05" value="${o.opacity}"></div></div><label class="check"><input data-check="flipX" type="checkbox" ${o.flipX?'checked':''}> Lật ngang</label><label class="check"><input data-check="locked" type="checkbox" ${o.locked?'checked':''}> Khóa vị trí</label><div class="row"><button id="duplicateObj">Nhân bản</button><button id="deleteObj" class="danger">Xóa</button></div><div class="objectList"><h3>Danh sách asset</h3><div class="objRows">${state.objects.slice().sort((a,b)=>a.z-b.z).map(x=>`<button class="objRow ${x.id===selectedId?'active':''}" data-select="${x.id}"><span>${escapeHtml(x.name)}</span><em>${x.x}, ${x.z}</em></button>`).join('')}</div></div>`;$$('[data-prop]').forEach(i=>i.onchange=()=>updateProp(i.dataset.prop,i.value));$$('[data-check]').forEach(i=>i.onchange=()=>updateProp(i.dataset.check,i.checked));$('#duplicateObj').onclick=duplicateSelected;$('#deleteObj').onclick=deleteSelected;$$('[data-select]').forEach(b=>b.onclick=()=>{selectedId=b.dataset.select;render()})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function updateProp(prop,value){let o=state.objects.find(x=>x.id===selectedId);if(!o)return;snapshot();if(['x','z','width','height','layer','opacity'].includes(prop))value=num(value,o[prop]);if(prop==='width'||prop==='height')value=Math.max(.1,value);if(prop==='opacity')value=Math.max(0,Math.min(1,value));o[prop]=value;markDirty();render()}
function render(){renderWorld();renderInspector()}
function objectPointerDown(e){e.stopPropagation();let o=state.objects.find(x=>x.id===e.currentTarget.dataset.id);if(!o)return;selectedId=o.id;renderInspector();if(view.mode==='pan'||o.locked)return;e.currentTarget.setPointerCapture(e.pointerId);snapshot();drag={kind:'object',id:o.id,pid:e.pointerId,startX:e.clientX,startY:e.clientY,ox:o.x,oz:o.z,moved:false}}
function stagePointerDown(e){if(e.target.closest('.viewTools,.zoomBox,.mapObj'))return;if(view.mode==='pan'||e.button===1||e.altKey){e.currentTarget.setPointerCapture(e.pointerId);drag={kind:'pan',pid:e.pointerId,startX:e.clientX,startY:e.clientY,px:view.panX,py:view.panY};return}selectedId=null;render()}
function pointerMove(e){let r=$('#stage').getBoundingClientRect(),p=screenToWorld(e.clientX-r.left,e.clientY-r.top);$('#cursorPos').textContent=`X ${p.x.toFixed(1)} · Z ${p.z.toFixed(1)}`;if(!drag||e.pointerId!==drag.pid)return;if(drag.kind==='pan'){view.panX=drag.px+e.clientX-drag.startX;view.panY=drag.py+e.clientY-drag.startY;renderWorld()}else{let o=state.objects.find(x=>x.id===drag.id);if(!o)return;o.x=snap(drag.ox+(e.clientX-drag.startX)/view.zoom);o.z=snap(drag.oz-(e.clientY-drag.startY)/(view.zoom*PROJ));drag.moved=true;markDirty();renderWorld();renderInspector()}}
function pointerUp(e){if(drag&&e.pointerId===drag.pid)drag=null}
function deleteSelected(){if(!selectedId)return;snapshot();state.objects=state.objects.filter(o=>o.id!==selectedId);selectedId=null;markDirty();render();toast('Đã xóa asset')}
function duplicateSelected(){let o=state.objects.find(x=>x.id===selectedId);if(!o)return;snapshot();let n={...clone(o),id:uid(),name:o.name+' copy',x:+(o.x+1).toFixed(2),z:+(o.z+1).toFixed(2)};state.objects.push(n);selectedId=n.id;markDirty();render();toast('Đã nhân bản')}
function undo(){if(!history.length)return;future.push(JSON.stringify(state));state=JSON.parse(history.pop());selectedId=null;markDirty();render()}
function redo(){if(!future.length)return;history.push(JSON.stringify(state));state=JSON.parse(future.pop());selectedId=null;markDirty();render()}
function setZoom(v,anchorX=null,anchorY=null){let r=$('#stage').getBoundingClientRect(),ax=anchorX??r.width/2,ay=anchorY??r.height/2,before=screenToWorld(ax,ay);view.zoom=Math.max(2.5,Math.min(18,v));let after=worldToScreen(before.x,before.z);view.panX+=ax-after.x;view.panY+=ay-after.y;renderWorld()}
function resetView(){view.zoom=7;view.panX=0;view.panY=0;renderWorld()}
function setMode(m){view.mode=m;$('#selectMode').classList.toggle('active',m==='select');$('#panMode').classList.toggle('active',m==='pan');$('#stage').style.cursor=m==='pan'?'grab':'default'}
function bracketArray(src,marker){let at=src.indexOf(marker);if(at<0)throw new Error('Không tìm thấy '+marker);let start=src.indexOf('[',at),depth=0,quote=null,esc=false,line=false,block=false;for(let i=start;i<src.length;i++){let c=src[i],n=src[i+1];if(line){if(c==='\n')line=false;continue}if(block){if(c==='*'&&n==='/'){block=false;i++}continue}if(quote){if(esc){esc=false;continue}if(c==='\\'){esc=true;continue}if(c===quote)quote=null;continue}if(c==='/'&&n==='/'){line=true;i++;continue}if(c==='/'&&n==='*'){block=true;i++;continue}if(c==='"'||c==="'"||c==='`'){quote=c;continue}if(c==='[')depth++;if(c===']'&&--depth===0)return src.slice(start,i+1)}throw new Error('Mảng không đóng')}
async function loadGameMap(){try{let src=await fetch('./game.js?editor='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});let props=(0,Function)('return ('+bracketArray(src,'villageProps:')+')')();let lanterns=(0,Function)('return ('+bracketArray(src,'lanternPosts:')+')')();snapshot();state={version:1,mapId:'thanh_van_thon',mapName:'Thanh Vân Thôn',ground:'assets/maps/common/grounds/ground_village_01.png',objects:props.map(p=>newObject({path:p.file},p.x,p.z,{width:p.width,height:p.height,name:niceName(p.file)}))};for(let p of lanterns)state.objects.push(newObject({path:'assets/maps/common/lanterns/lantern_post_village_01.png'},p.x,p.z,{width:2.2,height:3.2,name:'đèn đường'}));addWallRing(false);selectedId=null;markDirty();resetView();render();toast('Đã nạp Thanh Vân Thôn từ GAME')}catch(e){console.error(e);toast('Không nạp được map: '+e.message)}}
function addWallRing(pushHistory=true){if(pushHistory)snapshot();const files=Array.from({length:9},(_,i)=>`assets/maps/common/fences_gates/stone_wall_50deg_${String(i).padStart(2,'0')}.png`),order=[6,5,2,1,4,0,7,3,8],rx=43,rz=40,count=240;for(let i=0;i<count;i++){let a=i/count*Math.PI*2,x=Math.cos(a)*rx,z=Math.sin(a)*rz;if(Math.abs(x)<7&&Math.abs(z)>rz-4.6)continue;let tx=-rx*Math.sin(a),tz=rz*Math.cos(a),deg=Math.atan2(tz,tx)*180/Math.PI;while(deg>90)deg-=180;while(deg<-90)deg+=180;let logical=Math.max(0,Math.min(8,Math.round((deg+90)/22.5))),fi=order[logical];state.objects.push(newObject({path:files[fi]},x,z,{name:'tường vòng '+String(fi).padStart(2,'0'),width:3.35,height:3.35,layer:-5}))}state.objects.push(newObject({path:'assets/maps/common/fences_gates/gate_ornate_01.png'},0,-rz,{name:'cổng Bắc',width:5.8,height:5.4,layer:2}),newObject({path:'assets/maps/common/fences_gates/gate_wood_01.png'},0,rz,{name:'cổng Nam',width:5,height:4.6,layer:2}));if(pushHistory){markDirty();render();toast('Đã thêm vòng tường 9 góc')}}
function newMap(){if(!confirm('Tạo map mới? Bố cục hiện tại vẫn còn trong lịch sử hoàn tác.'))return;snapshot();state={version:1,mapId:'map_moi',mapName:'Map mới',ground:'assets/maps/common/grounds/ground_village_01.png',objects:[]};selectedId=null;markDirty();resetView();render()}
function exportData(){let data={...state,exportedAt:new Date().toISOString(),camera:{elevationDeg:50}};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${state.mapId||'map'}_layout.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Đã xuất file JSON')}
async function importFile(file){try{let data=JSON.parse(await file.text());if(!Array.isArray(data.objects))throw new Error('Thiếu danh sách objects');snapshot();state={version:1,mapId:data.mapId||'imported',mapName:data.mapName||'Map nhập',ground:data.ground||state.ground,objects:data.objects.map(o=>({...o,id:o.id||uid(),x:num(o.x),z:num(o.z),width:Math.max(.1,num(o.width,3)),height:Math.max(.1,num(o.height,3)),layer:num(o.layer),opacity:num(o.opacity,1),flipX:!!o.flipX,locked:!!o.locked}))};selectedId=null;markDirty();resetView();render();toast('Đã nhập '+state.objects.length+' asset')}catch(e){toast('File JSON không hợp lệ: '+e.message)}}
function gameCode(){let rows=state.objects.map(o=>`      {file:'${o.file}',width:${trimNum(o.width)},height:${trimNum(o.height)},x:${trimNum(o.x)},z:${trimNum(o.z)}},`);return `// Dán vào villageProps trong MAP_CONFIGS.${state.mapId}\nvillageProps:[\n${rows.join('\n')}\n    ]`}
function trimNum(n){return String(Math.round(num(n)*100)/100)}
function showCode(){openModal('Mã bố cục cho game.js',gameCode())}
function openModal(title,text){$('#modalTitle').textContent=title;$('#jsonText').value=text;$('#jsonModal').hidden=false}
async function copyModal(){try{await navigator.clipboard.writeText($('#jsonText').value);toast('Đã sao chép')}catch(e){$('#jsonText').select();document.execCommand('copy');toast('Đã sao chép')}}
function closeMobilePanels(){$('#assetPanel').classList.remove('open');$('#inspectorPanel').classList.remove('open')}
function bind(){let stage=$('#stage');stage.addEventListener('pointerdown',stagePointerDown);stage.addEventListener('pointermove',pointerMove);stage.addEventListener('pointerup',pointerUp);stage.addEventListener('pointercancel',pointerUp);stage.addEventListener('wheel',e=>{e.preventDefault();let r=stage.getBoundingClientRect();setZoom(view.zoom*(e.deltaY<0?1.12:.89),e.clientX-r.left,e.clientY-r.top)},{passive:false});$('#assetSearch').oninput=renderAssets;$('#loadGameBtn').onclick=loadGameMap;$('#newBtn').onclick=newMap;$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;$('#saveBtn').onclick=()=>{saveLocal();toast('Đã lưu trên thiết bị')};$('#exportBtn').onclick=exportData;$('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>{if(e.target.files[0])importFile(e.target.files[0]);e.target.value=''};$('#copyBtn').onclick=showCode;$('#wallBtn').onclick=()=>addWallRing(true);$('#selectMode').onclick=()=>setMode('select');$('#panMode').onclick=()=>setMode('pan');$('#gridBtn').onclick=()=>{view.grid=!view.grid;$('#gridBtn').classList.toggle('active',view.grid);renderWorld()};$('#zoomIn').onclick=()=>setZoom(view.zoom*1.18);$('#zoomOut').onclick=()=>setZoom(view.zoom/1.18);$('#resetView').onclick=resetView;$('#assetsToggle').onclick=()=>{$('#assetPanel').classList.toggle('open');$('#inspectorPanel').classList.remove('open')};$('#inspectorToggle').onclick=()=>{$('#inspectorPanel').classList.toggle('open');$('#assetPanel').classList.remove('open')};$('#modalClose').onclick=()=>$('#jsonModal').hidden=true;$('#modalCopy').onclick=copyModal;$('#jsonModal').onclick=e=>{if(e.target===$('#jsonModal'))$('#jsonModal').hidden=true};window.addEventListener('resize',renderWorld);window.addEventListener('keydown',e=>{let input=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){e.preventDefault();duplicateSelected();return}if(input)return;if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSelected();return}let o=state.objects.find(x=>x.id===selectedId);if(o&&!o.locked&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();snapshot();let step=e.shiftKey?5:1;if(e.key==='ArrowLeft')o.x-=step;if(e.key==='ArrowRight')o.x+=step;if(e.key==='ArrowUp')o.z+=step;if(e.key==='ArrowDown')o.z-=step;markDirty();render()}})}
async function init(){bind();renderCategories();renderAssets();let saved=localStorage.getItem(STORAGE);if(saved){try{state=JSON.parse(saved);render();toast('Đã mở bản lưu gần nhất');return}catch(e){}}await loadGameMap()}
init();
})();
</script>
